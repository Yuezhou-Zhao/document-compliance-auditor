<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect width="1180" height="620" fill="#0d1117"/>

  <text x="40" y="46" fill="#e6edf3" font-size="21" font-weight="700">KV-Cache Prefix Engineering</text>
  <text x="40" y="70" fill="#8b949e" font-size="13.5">One warm-up call fills the cache; every rule agent reuses it — the long document is prefilled once, not N times.</text>

  <!-- ===== Prompt topology ===== -->
  <text x="40" y="120" fill="#8b949e" font-size="12.5" font-weight="700" letter-spacing="0.5">EVERY CALL = ONE CACHED PREFIX + ONE SMALL VARIABLE SUFFIX</text>

  <!-- Cached segment -->
  <rect x="40" y="138" width="820" height="66" rx="8" fill="#12233b" stroke="#388bfd"/>
  <text x="60" y="166" fill="#58a6ff" font-size="14" font-weight="700">Cached segment — system turn</text>
  <text x="60" y="188" fill="#8b949e" font-size="12">System constraints + full source document (~60K tokens) · byte-for-byte identical across all N calls</text>

  <!-- Variable segment -->
  <rect x="872" y="138" width="268" height="66" rx="8" fill="#2b1f3a" stroke="#bc8cff"/>
  <text x="892" y="166" fill="#d2a8ff" font-size="14" font-weight="700">Variable — user turn</text>
  <text x="892" y="185" fill="#8b949e" font-size="11.5">the rule · challenge ·</text>
  <text x="892" y="200" fill="#8b949e" font-size="11.5">validator persona</text>

  <text x="40" y="230" fill="#8b949e" font-size="11.5">The variable part stays in the user turn — placing it in the system prompt would change the prefix and void the cache for every call.</text>

  <!-- ===== Flow ===== -->
  <!-- Warm-up -->
  <rect x="40" y="278" width="230" height="88" rx="8" fill="#161b22" stroke="#d29922"/>
  <text x="155" y="308" fill="#d29922" font-size="14" font-weight="700" text-anchor="middle">Warm-up call</text>
  <text x="155" y="330" fill="#8b949e" font-size="11.5" text-anchor="middle">1 minimal call prefills</text>
  <text x="155" y="346" fill="#8b949e" font-size="11.5" text-anchor="middle">the document prefix once</text>

  <line x1="270" y1="322" x2="308" y2="322" stroke="#8b949e" marker-end="url(#a)"/>
  <text x="289" y="312" fill="#8b949e" font-size="10.5" text-anchor="middle">then</text>

  <!-- N rule calls -->
  <rect x="310" y="256" width="500" height="132" rx="8" fill="#161b22" stroke="#3fb950"/>
  <text x="560" y="284" fill="#3fb950" font-size="14" font-weight="700" text-anchor="middle">N rule agents fan out concurrently</text>
  <text x="560" y="306" fill="#8b949e" font-size="12" text-anchor="middle">each call = cached prefix (HIT) + its own small rule suffix (MISS)</text>
  <!-- three mini bars -->
  <rect x="345" y="322" width="330" height="16" rx="3" fill="#12233b" stroke="#388bfd"/>
  <rect x="678" y="322" width="52" height="16" rx="3" fill="#2b1f3a" stroke="#bc8cff"/>
  <rect x="345" y="342" width="330" height="16" rx="3" fill="#12233b" stroke="#388bfd"/>
  <rect x="678" y="342" width="52" height="16" rx="3" fill="#2b1f3a" stroke="#bc8cff"/>
  <text x="738" y="335" fill="#8b949e" font-size="11">rule 1</text>
  <text x="738" y="355" fill="#8b949e" font-size="11">rule N</text>
  <text x="510" y="378" fill="#8b949e" font-size="10.5" text-anchor="middle">only the small suffix pays a fresh prefill</text>

  <!-- ===== Metric chips ===== -->
  <rect x="40" y="430" width="356" height="150" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="218" y="484" fill="#e6edf3" font-size="30" font-weight="800" text-anchor="middle">98% → &gt;99%</text>
  <text x="218" y="512" fill="#8b949e" font-size="12.5" text-anchor="middle">cache hit rate</text>
  <text x="218" y="533" fill="#8b949e" font-size="11.5" text-anchor="middle">98% measured at 20K-token prefix;</text>
  <text x="218" y="549" fill="#8b949e" font-size="11.5" text-anchor="middle">&gt;99% at production scale (~60K prefix)</text>

  <rect x="412" y="430" width="356" height="150" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="590" y="484" fill="#e6edf3" font-size="30" font-weight="800" text-anchor="middle">−32% TTFT</text>
  <text x="590" y="512" fill="#8b949e" font-size="12.5" text-anchor="middle">time to first token</text>
  <text x="590" y="533" fill="#8b949e" font-size="11.5" text-anchor="middle">4.60 s → 3.13 s, cold vs. warm</text>
  <text x="590" y="549" fill="#8b949e" font-size="11.5" text-anchor="middle">the skipped document prefill</text>

  <rect x="784" y="430" width="356" height="150" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="962" y="484" fill="#e6edf3" font-size="30" font-weight="800" text-anchor="middle">1× vs N×</text>
  <text x="962" y="512" fill="#8b949e" font-size="12.5" text-anchor="middle">document prefill cost</text>
  <text x="962" y="533" fill="#8b949e" font-size="11.5" text-anchor="middle">the 60K-token document is prefilled</text>
  <text x="962" y="549" fill="#8b949e" font-size="11.5" text-anchor="middle">once, then shared by all N rule agents</text>
</svg>
